[package]
name = "s-graph"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "algorithms"
harness = false
required-features = ["heap"]

# Release plus debug info, for `perf record`/`perf annotate` with source
# lines. Doesn't touch `[profile.release]`.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[features]
default = ["heap"]
# Immutable FST, composable automata/queries/analytics, and the mutable Heap
# backend. Zero extra runtime dependencies.
heap = []
# Real-file backend (pread/pwrite + a page-chunked stack cache). Near-zero
# steady-state RAM at the cost of I/O latency; see `storage_file` module docs.
file = []
# LZ4-compressed in-RAM backend. Pulls in `lz4_flex`; see `storage_compressed`
# module docs for the chunking design and the safe-vs-unsafe-lz4 tradeoff.
compressed = ["dep:lz4_flex"]
# `rayon`-based fan-out during bulk build. Off by default so a single-
# threaded consumer isn't forced to pull rayon into their dependency tree;
# on, it's a measured ~4x bulk-build speedup at large N (see s-bench:
# https://github.com/hrssilva/s-bench).
parallel = ["dep:rayon"]

[dependencies]
# Optional: only compiled in behind the `compressed` feature. Pinned to a
# version with `safe-encode`/`safe-decode` on by default (both are, as of
# 0.12.1+, the version that also fixed RUSTSEC-2026-0041 -- an
# uninitialized-read issue in the unsafe path this crate doesn't use) --
# compiles to zero unsafe code. LZ4 is decompression-optimized by design,
# matching `CompressedStorage`'s read-heavy, decompress-on-every-touch
# workload better than a higher-ratio/slower-decode codec would.
lz4_flex = { version = "0.14", optional = true }
# Optional: only compiled in behind the `parallel` feature.
rayon = { version = "1", optional = true }

[dev-dependencies]
rayon = "1"
# Only used by radixtree_dfs_interleaved_varskip_unrolled_mmap.rs and
# radixtree_dfs_interleaved_varskip_unrolled_file_mmap.rs, for the raw
# mmap()/munmap()/madvise() syscalls that back their blocks -- the two
# files in this project with an explicit, scoped exception to the "no
# unsafe" rule, because real memory-mapping has no safe-Rust equivalent.
libc = "0.2"
# Only used by radixtree_dfs_interleaved_varskip_unrolled_generic.rs's
# CompressedStorage backend, for LZ4 block compression. Pinned to a
# version with `safe-encode`/`safe-decode` on by default (both are, as
# of 0.12.1+, the version that also fixed RUSTSEC-2026-0041 / an
# uninitialized-read issue in the unsafe path we don't use) -- compiles
# to zero unsafe code, unlike every mainstream Zstd binding (C FFI) and
# unlike the pure-Rust Zstd crates available at time of writing, which
# are too new/low-adoption to depend on. LZ4 is decompression-optimized
# by design, matching CompressedStorage's read-heavy, decompress-on-
# every-touch workload better than a higher-ratio/slower-decode codec
# would.
lz4_flex = "0.14"

[[example]]
name = "join_perf_four"
path = "examples/join/join_perf_four.rs"
required-features = ["heap"]

[[example]]
name = "automata"
path = "examples/automata.rs"
required-features = ["heap"]

[[example]]
name = "skew_repro3"
path = "examples/join/skew_repro3.rs"
required-features = ["heap"]
